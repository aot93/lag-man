[project]
name = "camlag"
version = "0.1.0"
description = "Glass-to-glass camera latency test generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The full-screen renderer. Pure logic (timecode, strip, layout, timing) has no dependencies.
generator = ["pygame-ce>=2.5"]
# The control camera recording analysis (SPEC.md, "Extension 2: image analysis").
analysis = ["opencv-python-headless>=4.10", "numpy>=2"]

[project.scripts]
camlag-generator = "camlag.generator.app:main"
camlag-analyse = "camlag.analysis.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camlag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
